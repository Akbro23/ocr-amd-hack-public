<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="370" rx="16" fill="#ffffff"/>

  <!-- plate: state name and slogan are dropped -->
  <rect x="20" y="20" width="260" height="130" rx="12" fill="#eef2fb" stroke="#333" stroke-width="4"/>
  <text x="150" y="55" font-size="22" font-weight="bold" fill="#c0392b" text-anchor="middle">CALIFORNIA</text>
  <text x="150" y="118" font-size="56" font-weight="bold" fill="#1f2a6e" text-anchor="middle">7ABC123</text>
  <text x="150" y="140" font-size="12" fill="#c0392b" text-anchor="middle">dmv.ca.gov</text>
  <text x="370" y="72" font-size="14" fill="#555" text-anchor="middle">Qwen3.5-9B · AMD GPU</text>
  <line x1="300" y1="85" x2="440" y2="85" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="460" y="55" width="280" height="60" rx="8" fill="#1e1e1e"/>
  <text x="600" y="92" font-size="18" font-family="Menlo, Consolas, monospace" fill="#e6e6e6" text-anchor="middle">{"text": "7ABC123"}</text>

  <!-- sign: multi-line, read top to bottom -->
  <polygon points="150,180 235,265 150,350 65,265" fill="#f28c1c" stroke="#111" stroke-width="5"/>
  <text x="150" y="242" font-size="22" font-weight="bold" fill="#111" text-anchor="middle">ROAD</text>
  <text x="150" y="272" font-size="22" font-weight="bold" fill="#111" text-anchor="middle">WORK</text>
  <text x="150" y="302" font-size="22" font-weight="bold" fill="#111" text-anchor="middle">AHEAD</text>
  <line x1="300" y1="265" x2="440" y2="265" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="460" y="235" width="280" height="60" rx="8" fill="#1e1e1e"/>
  <text x="600" y="271" font-size="16" font-family="Menlo, Consolas, monospace" fill="#e6e6e6" text-anchor="middle">{"text": "ROAD WORK AHEAD"}</text>
</svg>
