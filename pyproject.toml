[project]
name = "ocr-amd-hack"
version = "0.1.0"
requires-python = ">=3.11"
# Never list torch/torchvision: the ROCm base image ships its own torch, a PyPI one would be CUDA.
dependencies = [
    "transformers==5.24.0",
    "accelerate==1.16.0",
]

[project.optional-dependencies]
dev = ["pymupdf==2.1"]  # only for tools/extract_samples.py
